name: Ultimate Secure Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ master, dev, security-flow ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.png'
      - '**.jpg'
      - '**.svg'
  pull_request:
    branches: [ master, dev ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g -XX:+UseContainerSupport'
  PRODUCTION_BRANCH: 'master'
  SECURITY_TIMEOUT: 600
  IMAGE_NAME: springboot-app

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true




# ========== STAGE 1: PRE-FLIGHT CHECKS ==========
jobs:
  pre_flight:
    name: 🛡️ Pre-Flight Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code securely
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔍 Verify commit signatures
        if: github.event_name == 'push'
        run: |
          if git log --show-signature -1 | grep -q "Good signature"; then
            echo "✅ Commit signature verified"
          else
            echo "⚠️ Commit not signed"
          fi

      - name: 🚫 Detect dangerous Java patterns
        run: |
          BANNED_PATTERNS=(
            "Runtime.getRuntime\\("
            "ProcessBuilder\\("
            "System.exit\\("
            "setSecurityManager"
            "Class.forName"
            "ReflectionUtils"
          )

          for pattern in "${BANNED_PATTERNS[@]}"; do
            if grep -R "$pattern" src/main/java; then
              echo "❌ Dangerous pattern detected: $pattern"
              exit 1
            fi
          done
          echo "✅ No dangerous patterns found"

      - name: 🕵️ Detect hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: 📦 Dependency review (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: high


# ========== STAGE 2: SECURITY SCANNING ==========
  security_scanning:
    name: 🔒 Comprehensive Security Scanning
    runs-on: ubuntu-latest
    needs: pre_flight
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 🔍 OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -Dformat=JSON \
            -DfailBuildOnCVSS=7

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: 🧠 Build for CodeQL
        run: mvn -q compile -DskipTests

      - name: 📝 CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: always

      - name: 🔍 Advanced SAST (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/java
          severity: ERROR

      - name: 🏗️ IaC Scan (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: all
          output_format: sarif

      - name: 🗂️ Generate SBOM (CycloneDX)
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom

      - name: 💾 Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ github.sha }}
          path: |
            target/dependency-check-report.json
            target/bom.json
            *.sarif


# ========== STAGE 3: CODE QUALITY & TESTING ==========
  code_quality:
    name: 🧪 Code Quality & Testing
    runs-on: ubuntu-latest
    needs: security_scanning
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 🧪 Run unit & integration tests
        run: mvn verify

      - name: 🔍 Static analysis (SpotBugs, Checkstyle, PMD)
        run: mvn spotbugs:check checkstyle:check pmd:check


# ========== STAGE 4: SECURE BUILD ==========
  secure_build:
    name: 🏗️ Secure Build
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 🔨 Build Spring Boot JAR
        run: mvn clean package -DskipTests=false

      - name: 🐳 Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: 🔍 Scan container (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: $IMAGE_NAME:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif

      - name: 💾 Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            target/*.jar
            trivy-results.sarif


# ========== STAGE 5: DEPLOYMENT ==========
  deployment:
    name: 🚀 Secure Deployment
    runs-on: ubuntu-latest
    needs: secure_build
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}

      - name: ⏸️ Manual approval (Production)
        if: github.ref == 'refs/heads/master'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: ${{ secrets.PRODUCTION_APPROVERS }}

      - name: 🚀 Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-deploy: true



# ========== STAGE 6: POST-DEPLOYMENT SECURITY ==========
  post_deployment:
    name: 🔍 Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deployment
    timeout-minutes: 15

    steps:
      - name: 🌐 Health check
        run: |
          URL=${{ github.ref == 'refs/heads/master' && secrets.PRODUCTION_URL || secrets.STAGING_URL }}
          curl -f "$URL/actuator/health"

      - name: 🛡️ Security headers check
        run: |
          curl -sI "$URL" | grep -Ei "X-Frame-Options|X-Content-Type-Options|Strict-Transport-Security"

      - name: 🔐 SSL expiration check
        if: github.ref == 'refs/heads/master'
        run: |
          DOMAIN=${{ secrets.PRODUCTION_DOMAIN }}
          echo | openssl s_client -connect $DOMAIN:443 -servername $DOMAIN \
            | openssl x509 -noout -enddate
