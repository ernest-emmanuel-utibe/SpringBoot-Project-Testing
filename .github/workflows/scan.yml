name: Spring Boot Enterprise CI/CD

on:
  push:
    branches: [ "master", "dev", "security-flow" ]
  pull_request:
    branches: [ "master", "dev", "security-flow" ]

env:
  APP_NAME: springboot-demo
  JAVA_VERSION: '21'   # Java 25 is not enterprise-stable yet
  MAVEN_OPTS: "-Xmx2g"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B clean compile

      - name: Unit Tests
        run: mvn -B test


  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # 🔥 Critical: cache OWASP DB
      - name: Cache OWASP Dependency-Check DB
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}

      - name: OWASP Dependency Check (retry-safe)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          for i in 1 2 3; do
            mvn -B verify -Pci && break
            echo "Retrying dependency-check ($i)..."
            sleep 60
          done


  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t $APP_NAME:${{ github.sha }} .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.APP_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1


  push-image:
    name: Push Image to ECR
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login \
            --username AWS \
            --password-stdin \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Push Image
        run: |
          docker tag $APP_NAME:${{ github.sha }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/$APP_NAME:latest

          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/$APP_NAME:latest
