name: Spring Boot Enterprise CI/CD

on:
  push:
    branches: [ "master", "dev", "security-flow" ]
  pull_request:
    branches: [ "master", "dev", "security-flow" ]

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  APP_NAME: springboot-demo
  JAVA_VERSION: '21'
  MAVEN_OPTS: "-Xmx2g"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B clean compile

      - name: Unit Tests
        run: mvn -B test


  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build for CodeQL
        run: mvn -B clean package -DskipTests

      - uses: github/codeql-action/analyze@v3


  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache OWASP Dependency-Check DB
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}

      - name: OWASP Dependency Check (strict gating)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DnvdApiKey=$NVD_API_KEY \
            -DfailBuildOnCVSS=7 \
            -Dformat=ALL


  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t $APP_NAME:${{ github.sha }} .

      - name: Trivy Image Scan (strict)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.APP_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true


  push-image:
    name: Push Image to ECR
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC preferred)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login \
            --username AWS \
            --password-stdin \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Push Image
        run: |
          docker tag $APP_NAME:${{ github.sha }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/$APP_NAME:${{ github.sha }}

          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/$APP_NAME:${{ github.sha }}
